<script>
"use strict";
/* ============================================================================
   CAPITAL HOLDINGS — Simulador económico hiper-realista (single file)
   Motor de ticks (1 tick = 1 día), macroeconomía cíclica, finanzas, bienes
   raíces, bolsa apalancada, corporaciones y banca. Sin alert/confirm/modales.
============================================================================ */

/* ---------------------------- Utilidades ---------------------------------- */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rnd = (a,b) => a + Math.random()*(b-a);
const rint = (a,b) => Math.floor(rnd(a,b+1));
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const chance = p => Math.random() < p;
// Ruido gaussiano (Box-Muller)
function gauss(mean=0, sd=1){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return mean + sd*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const money = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const money2 = n => (n<0?'-':'') + '$' + Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pctf = n => (n>=0?'+':'') + n.toFixed(2) + '%';
const MONTHS = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

/* ------------------------------ Estado ------------------------------------ */
const S = {
  day: 0,
  date: new Date(2025,0,1),
  speed: 0,
  timer: null,
  tab: 'empleo',
  log: [],

  macro: { phase:'Expansión', phaseTicks:0, phaseLen:rint(200,600), baseRate:0.035, targetRate:0.05, inflation:0.032 },

  player: {
    cash: 500,
    creditScore: 600,
    energy: 100,
    mental: 100,
    working: false,
    resting: false,
    restDays: 0,
    // empleo
    jobTier: 1,                // empleo actual (0 = desempleado)
    unlocked: [1],             // tiers desbloqueados
    study: null,               // {tier, need, done}
    // vivienda: 0=habitacion,1=depto,2=casa, o {own:idx} si habita propiedad
    housing: 0,
    livingInProperty: -1,      // índice de propiedad habitada (-1 = ninguna)
    daysWorked: 0,
    totalEarned: 0,
  },

  debt: {
    student:  { bal:12000, rate:0.065 },     // préstamo universitario
    card:     { bal:0,     rate:0.24  },     // tarjeta de crédito
  },
  mortgages: [],   // {propId, bal, rate, monthly, termLeft}
  loans: [],       // préstamos comerciales {bal, rate, id}

  properties: [],  // propiedades compradas

  stocks: {},      // ver init
  holdings: {},    // por símbolo: {shares, avgCost, mShares, mLoan, mEntry}

  corps: [],       // empresas fundadas

  // contadores mensuales
  billDay: 30,
  rentDay: 30,
};

/* Catálogo de empleos */
const JOBS = [
  null,
  { tier:1, name:'Operario',        wage:12,  studyNeed:0   },
  { tier:2, name:'Administrativo',  wage:22,  studyNeed:60  },
  { tier:3, name:'Programador',     wage:45,  studyNeed:160 },
  { tier:4, name:'Gerente',         wage:85,  studyNeed:320 },
  { tier:5, name:'Director Ejecutivo', wage:210, studyNeed:520 },
];

/* Vivienda en alquiler (Pestaña A) */
const HOUSING = [
  { name:'Habitación', rent:400, comfort:0 },
  { name:'Departamento', rent:1100, comfort:1 },
  { name:'Casa', rent:2800, comfort:2 },
];

/* Catálogo de bienes raíces */
const REALTY = [
  { name:'Estudio',                 price:85000,  rent:780,  type:'Residencial' },
  { name:'Depto 2 ambientes',       price:165000, rent:1450, type:'Residencial', livable:true },
  { name:'Local Comercial',         price:240000, rent:2350, type:'Comercial' },
  { name:'Edificio de Oficinas',    price:920000, rent:9200, type:'Comercial' },
];

/* Tipologías de empresa */
const CORP_TYPES = [
  { id:'kiosco',  name:'Kiosco / Retail Físico', cap:5000,  basePrice:6,   baseQ:30, desc:'Bajo capital, margen bajo, demanda constante.' },
  { id:'mkt',     name:'Agencia de Marketing',   cap:15000, basePrice:1200,baseQ:40, desc:'Escala contratando empleados. Alta rentabilidad.' },
  { id:'saas',    name:'SaaS / Software',        cap:50000, basePrice:49,  baseQ:25, desc:'I+D intenso 100 ticks; replicación a coste $0 (exponencial).' },
  { id:'vc',      name:'Fondo de Capital Riesgo',cap:250000,basePrice:0,   baseQ:0,  desc:'Sólo con patrimonio neto > $1M. Rinde sobre el capital colocado.' },
];

/* ------------------------- Inicialización bolsa --------------------------- */
function initStocks(){
  S.stocks = {
    TBOND: { name:'Bonos del Tesoro', sym:'TBOND', price:100, prev:100, vol:0.0005, kind:'bond', hist:[] },
    SPX:   { name:'Índice S&P 500',   sym:'SPX',   price:450, prev:450, vol:0.011, drift:0.08, kind:'index', hist:[] },
    ALPHA: { name:'Corp Alpha (Blue Chip)', sym:'ALPHA', price:120, prev:120, vol:0.006, drift:0.04, div:0.03, kind:'blue', hist:[] },
    BIOGEN:{ name:'BioGen (Tech)',    sym:'BIOGEN',price:64, prev:64, vol:0.032, drift:0.12, kind:'tech', hist:[] },
    SOLAR: { name:'Solarium (Cripto)',sym:'SOLAR', price:9.5, prev:9.5, vol:0.06, kind:'crypto', regime:'normal', regimeTicks:0, hist:[] },
  };
  for(const k in S.stocks){ S.holdings[k] = { shares:0, avgCost:0, mShares:0, mLoan:0, mEntry:0 }; const st=S.stocks[k]; for(let i=0;i<40;i++) st.hist.push(st.price); }
}

/* ------------------------------- LOG -------------------------------------- */
function fmtDate(){ const d=S.date; return `${String(d.getDate()).padStart(2,'0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function log(msg, cls=''){
  const stamp = `[${fmtDate()}]`;
  S.log.push({ t:stamp, m:msg, c:cls });
  if(S.log.length>400) S.log.shift();
  const term = $('terminal');
  if(term){
    const line = document.createElement('div');
    line.className = 'l ' + (cls==='neg'?'text-red-400':cls==='pos'?'text-emerald-400':cls==='warn'?'text-amber-400':cls==='info'?'text-sky-400':'text-green-500');
    line.innerHTML = `<span class="text-green-700">${stamp}</span> ${msg}`;
    term.appendChild(line);
    while(term.childElementCount>400) term.removeChild(term.firstChild);
    term.scrollTop = term.scrollHeight;
  }
}

/* ============================== MACRO ===================================== */
function updateMacro(){
  const m = S.macro;
  m.phaseTicks++;
  if(m.phaseTicks >= m.phaseLen){
    // transición de ciclo: Expansión -> Pico -> Contracción -> Valle -> Expansión
    const order = ['Expansión','Pico','Contracción','Valle'];
    const idx = (order.indexOf(m.phase)+1)%4;
    m.phase = order[idx];
    m.phaseTicks = 0;
    m.phaseLen = rint(200,600);
    const targets = { 'Expansión':rnd(0.035,0.055), 'Pico':rnd(0.075,0.11), 'Contracción':rnd(0.04,0.07), 'Valle':rnd(0.015,0.03) };
    m.targetRate = targets[m.phase];
    log(`📊 La economía entra en fase de <b>${m.phase.toUpperCase()}</b>. El Banco Central reorienta su política monetaria.`, 'info');
  }
  // la tasa deriva hacia el objetivo con ruido
  m.baseRate += (m.targetRate - m.baseRate)*0.01 + gauss(0,0.0006);
  m.baseRate = clamp(m.baseRate, 0.015, 0.11);
  // inflación según fase
  const inflTarget = { 'Expansión':0.035, 'Pico':0.065, 'Contracción':0.028, 'Valle':0.012 }[m.phase];
  m.inflation += (inflTarget - m.inflation)*0.02 + gauss(0,0.0004);
  m.inflation = clamp(m.inflation, 0.002, 0.14);
}

/* ============================== FINANZAS ================================== */
function dailyRate(annual){ return annual/365; }

function accrueDebts(){
  // Préstamo estudiantil: interés diario. Si hay liquidez, se paga (sube score); si no, se capitaliza (impago).
  const sl = S.debt.student;
  if(sl.bal > 0){
    const i = sl.bal * dailyRate(sl.rate);
    if(S.player.cash >= i){
      S.player.cash -= i;
      S.player.creditScore = clamp(S.player.creditScore + 0.05, 300, 850);
    } else {
      sl.bal += i;
      defaulted('préstamo universitario');
    }
  }
  // Tarjeta de crédito: capitaliza siempre (interés alto). Penaliza score si hay saldo alto.
  const cc = S.debt.card;
  if(cc.bal > 0){
    cc.bal += cc.bal * dailyRate(cc.rate);
    if(cc.bal > 3000) S.player.creditScore = clamp(S.player.creditScore - 0.06, 300, 850);
  }
  // Préstamos comerciales
  for(const ln of S.loans){
    if(ln.bal>0){
      const i = ln.bal*dailyRate(ln.rate);
      if(S.player.cash >= i){ S.player.cash -= i; S.player.creditScore = clamp(S.player.creditScore+0.03,300,850); }
      else { ln.bal += i; defaulted('préstamo comercial'); }
    }
  }
  // Hipotecas: interés diario; cuota se cobra mensual
  for(const mg of S.mortgages){
    if(mg.bal>0) mg.bal += mg.bal*dailyRate(mg.rate);
  }
}

let defaultCooldown = 0;
function defaulted(what){
  S.player.creditScore = clamp(S.player.creditScore - 1.2, 300, 850);
  if(defaultCooldown<=0){
    log(`⚠️ <b>IMPAGO</b>: no hay liquidez para cubrir intereses de tu ${what}. La deuda se capitaliza y tu puntaje crediticio cae.`, 'neg');
    defaultCooldown = 20;
  }
}

function monthlyBills(){
  // Costo de vida: alquiler de vivienda (si no habita propiedad propia)
  if(S.player.livingInProperty < 0){
    const h = HOUSING[S.player.housing];
    charge(h.rent, `Alquiler (${h.name})`);
  }
  // Cuotas de hipoteca
  for(const mg of S.mortgages){
    if(mg.bal>0 && mg.termLeft>0){
      const pay = Math.min(mg.monthly, mg.bal); // cuota mensual (interés ya capitalizado a diario)
      if(S.player.cash >= pay){ S.player.cash -= pay; mg.bal = Math.max(0, mg.bal - pay); mg.termLeft--; }
      else { // no paga cuota -> a tarjeta
        S.debt.card.bal += pay; S.player.creditScore = clamp(S.player.creditScore-0.6,300,850);
        log(`🏦 No pudiste cubrir la cuota hipotecaria (${money(pay)}). Se cargó a tu tarjeta de crédito.`, 'neg');
        mg.termLeft--;
      }
      mg.bal = Math.max(0, mg.bal);
      if(mg.bal<=0) log('🏦 Hipoteca totalmente cancelada. La propiedad es 100% tuya.', 'pos');
    }
  }
}

// Cobro: intenta liquidez, si no alcanza va a tarjeta de crédito
function charge(amount, concept){
  if(S.player.cash >= amount){ S.player.cash -= amount; return; }
  const remainder = amount - S.player.cash;
  S.player.cash = 0;
  S.debt.card.bal += remainder;
  log(`💳 ${concept}: liquidez insuficiente, ${money(remainder)} cargado a tarjeta (24% TNA).`, 'warn');
}

/* ============================== EMPLEO ==================================== */
function doWorkTick(){
  const p = S.player;
  // recuperación nocturna de energía
  p.energy = clamp(p.energy + 60, 0, 100);
  // salud mental: leve recuperación pasiva (mejor con vivienda cómoda)
  const comfort = p.livingInProperty>=0 ? 2 : HOUSING[p.housing].comfort;
  p.mental = clamp(p.mental + 1.5 + comfort*0.6, 0, 100);

  if(p.resting){
    p.restDays--;
    p.mental = clamp(p.mental + 7, 0, 100);
    if(p.restDays<=0){ p.resting=false; log('🌴 Vuelves de vacaciones renovado.', 'pos'); }
    return;
  }
  // estudio
  if(p.study){
    p.study.done++;
    if(p.study.done >= p.study.need){
      p.unlocked.push(p.study.tier);
      log(`🎓 Completaste la formación para <b>${JOBS[p.study.tier].name}</b>. Ya puedes aceptar ese empleo.`, 'pos');
      p.study = null;
    }
    return; // estudiar a tiempo completo: no se trabaja
  }
  // trabajar
  if(p.working && p.jobTier>0 && p.energy>=50){
    const job = JOBS[p.jobTier];
    // salario ajustado por inflación acumulada (los salarios suben con el tiempo)
    const wage = job.wage * (1 + (S.macro.inflation-0.03)*0.5);
    const pay = wage*8;
    p.cash += pay; p.totalEarned += pay; p.daysWorked++;
    p.energy = clamp(p.energy-50,0,100);
    p.mental = clamp(p.mental-5,0,100);
    if(p.mental < 15) burnout();
  }
}

function burnout(){
  const p = S.player;
  p.jobTier = 0; p.working = false;
  const med = rint(800,2200);
  charge(med, 'Gastos médicos por Burnout');
  p.mental = clamp(p.mental+25,0,100);
  log(`🧠 <b>BURNOUT</b>: tu salud mental colapsó. Perdiste el empleo y pagaste ${money(med)} en tratamiento médico.`, 'neg');
}

/* ============================== BOLSA ==================================== */
function updateStocks(){
  for(const k in S.stocks){
    const st = S.stocks[k];
    st.prev = st.price;
    if(st.kind==='bond'){
      // crece con la tasa del BC; precio inverso suave a cambios de tasa
      st.price *= (1 + dailyRate(S.macro.baseRate));
    } else if(st.kind==='crypto'){
      // ciclos de burbuja
      st.regimeTicks--;
      if(st.regimeTicks<=0){
        if(st.regime==='normal' && chance(0.5)){ st.regime='mania'; st.regimeTicks=rint(30,80); log('🚀 <b>Solarium</b> entra en frenesí especulativo. La manía cripto se dispara.', 'warn'); }
        else if(st.regime==='mania'){ st.regime='crash'; st.regimeTicks=rint(15,40); log('💥 <b>Solarium</b>: estalla la burbuja. Caída libre del activo cripto.', 'neg'); }
        else { st.regime='normal'; st.regimeTicks=rint(40,120); }
      }
      let drift = 0;
      if(st.regime==='mania') drift = 0.05;
      else if(st.regime==='crash') drift = -0.06;
      st.price *= (1 + drift + gauss(0, st.vol));
      st.price = Math.max(0.05, st.price);
    } else {
      const drift = (st.drift||0)/365;
      // sensibilidad inversa a la tasa para acciones de riesgo
      const rateDrag = (st.kind==='tech'||st.kind==='index') ? -(S.macro.baseRate-0.04)*0.05/365 : 0;
      st.price *= (1 + drift + rateDrag + gauss(0, st.vol));
      st.price = Math.max(0.1, st.price);
    }
    st.hist.push(st.price); if(st.hist.length>60) st.hist.shift();
  }
  // dividendos diarios de blue chip
  payDividends();
  // margin calls
  checkMargin();
}

function payDividends(){
  const al = S.stocks.ALPHA, h = S.holdings.ALPHA;
  const totShares = h.shares + h.mShares;
  if(totShares>0){
    const d = totShares * al.price * dailyRate(al.div);
    S.player.cash += d;
  }
}

function checkMargin(){
  for(const k in S.holdings){
    const h = S.holdings[k], st = S.stocks[k];
    if(h.mShares>0 && st.price <= h.mEntry*0.75){
      // margin call: liquidación forzosa
      const proceeds = h.mShares*st.price;
      const net = proceeds - h.mLoan;
      S.player.cash += Math.max(0, net);
      log(`📉 <b>MARGIN CALL</b> en ${st.sym}: el activo cayó 25% desde tu entrada. Posición apalancada liquidada automáticamente. Recuperas ${money(Math.max(0,net))}.`, 'neg');
      h.mShares=0; h.mLoan=0; h.mEntry=0;
      S.player.creditScore = clamp(S.player.creditScore-0.4,300,850);
    }
  }
}

/* ============================== BIENES RAÍCES ============================= */
function realEstateMonthly(){
  for(const p of S.properties){
    if(p.mode==='alquilar'){
      // riesgo de vacancia
      if(p.vacant>0){ p.vacant--; }
      else if(chance(0.08)){ p.vacant = rint(1,2); log(`🏚️ Tu ${p.name} quedó vacante (sin inquilino) ~${p.vacant} mes(es).`, 'warn'); }
      if(p.vacant<=0){
        const rent = p.rent * (1 + (S.macro.inflation-0.03));
        S.player.cash += rent;
        p.collected += rent;
      }
      // mantenimiento 1% anual mensualizado + riesgo aleatorio
      const maint = p.price * 0.01/12 * rnd(0.5,1.6);
      charge(maint, `Mantenimiento ${p.name}`);
    }
  }
}

/* ============================== CORPORACIONES ============================= */
function updateCorps(){
  for(const c of S.corps){
    if(c.closed) continue;
    runCorpDay(c);
  }
}

function runCorpDay(c){
  const T = CORP_TYPES.find(t=>t.id===c.type);
  // I+D / desarrollo SaaS
  let rndCost = 0;
  if(c.type==='saas'){
    if(c.devProgress < 100){
      rndCost = 350 + c.devProgress*4;
      c.devProgress = Math.min(100, c.devProgress + rnd(0.8,1.6));
    }
  }
  // inversión I+D activa (sube calidad)
  if(c.rdSpend>0){ rndCost += c.rdSpend; c.quality = Math.min(100, c.quality + c.rdSpend/2500); }

  // ¿requiere energía del jugador? (sin CEO)
  let capacity = 1;
  if(!c.ceo){
    if(S.player.energy >= 12){ S.player.energy = clamp(S.player.energy-12,0,100); }
    else { capacity = 0.5; }
  }

  // demanda en función de precio, calidad y empleados
  let revenue=0, cogs=0;
  if(c.type==='vc'){
    // rinde sobre el capital colocado, atado a mercado + ciclo
    const base = S.macro.baseRate + 0.06;
    const swing = gauss(0, 0.0009);
    revenue = c.capital * (base/365 + swing) * capacity;
    if(revenue<0 && chance(0.3)) log(`📉 Tu Fondo de Capital Riesgo sufre una desinversión fallida hoy: ${money(revenue)}.`, 'warn');
  } else if(c.type==='saas'){
    const developed = c.devProgress>=100;
    const qualityFactor = 0.5 + c.quality/100;
    const priceElast = Math.max(0.05, 1 - (c.price-49)/180);
    const reach = (developed?1:0.15) * (1 + c.vendedores*0.6 + c.operarios*0.1);
    const users = Math.max(0, 380 * reach * priceElast * qualityFactor * capacity * c.demandMod);
    revenue = users * c.price/30; // ingreso diario (suscripción mensual prorrateada)
    cogs = developed ? users*0.02 : users*0.6; // tras desarrollo, replicación ~$0
  } else if(c.type==='mkt'){
    const qualityFactor = 0.6 + c.quality/100;
    const priceElast = Math.max(0.1, 1 - (c.price-1200)/4000);
    const clients = Math.max(0, (0.4 + c.vendedores*1.1) * priceElast * qualityFactor * capacity * c.demandMod);
    revenue = clients * c.price/30;
    cogs = revenue*0.18;
  } else { // kiosco
    const qualityFactor = 0.7 + c.quality/100;
    const priceElast = Math.max(0.05, 1 - (c.price-6)/14);
    const footfall = (60 + c.vendedores*35 + c.operarios*18) * priceElast * qualityFactor * capacity * c.demandMod;
    revenue = footfall * c.price;
    cogs = footfall * (c.price*0.62); // margen bajo
  }

  // nómina
  const wages = c.operarios*95 + c.vendedores*130 + (c.ceo?300:0);
  // alquiler/operación fija
  const fixed = T.cap*0.0008 + 20;

  const profit = revenue - cogs - wages - fixed - rndCost;
  c.cash += profit;
  // historial para EBITDA
  c.profitHist.push(profit); if(c.profitHist.length>120) c.profitHist.shift();
  c.revToday = revenue; c.profitToday = profit;
  c.lifetimeProfit += profit;

  // recuperación de modificador de demanda (eventos)
  if(c.demandModDays>0){ c.demandModDays--; if(c.demandModDays<=0){ c.demandMod=1; } }

  // quiebra
  if(c.cash < -2000){
    c.closed = true;
    log(`☠️ <b>QUIEBRA</b>: "${c.name}" (${T.name}) no pudo sostener sus costos y cerró operaciones.`, 'neg');
  }
}

function corpEBITDA(c){
  if(c.profitHist.length===0) return 0;
  const avg = c.profitHist.reduce((a,b)=>a+b,0)/c.profitHist.length;
  return avg*365;
}
function corpValuation(c){
  if(c.closed) return 0;
  if(c.type==='vc') return Math.max(c.capital, c.cash + c.capital);
  return Math.max(0, corpEBITDA(c)*8) + Math.max(0,c.cash);
}

/* ============================== TICK ====================================== */
function tick(){
  S.day++;
  S.date.setDate(S.date.getDate()+1);
  if(defaultCooldown>0) defaultCooldown--;

  updateMacro();
  doWorkTick();
  accrueDebts();
  updateStocks();
  updateCorps();

  // mensualidades
  S.billDay--;
  if(S.billDay<=0){ monthlyBills(); realEstateMonthly(); S.billDay=30; }

  maybeEvent();

  render();
}

/* ============================== NET WORTH ================================ */
function stockValue(){
  let v=0;
  for(const k in S.holdings){ const h=S.holdings[k], st=S.stocks[k]; v += h.shares*st.price; v += h.mShares*st.price - h.mLoan; }
  return v;
}
function propertyEquity(){
  let v=0;
  for(const p of S.properties){
    const mg = S.mortgages.find(m=>m.propId===p.id);
    v += p.price - (mg?mg.bal:0);
  }
  return v;
}
function corpsValue(){ return S.corps.reduce((a,c)=>a+corpValuation(c),0); }
function totalDebt(){
  let d = S.debt.student.bal + S.debt.card.bal;
  d += S.loans.reduce((a,l)=>a+l.bal,0);
  d += S.mortgages.reduce((a,m)=>a+m.bal,0);
  return d;
}
function netWorth(){
  return S.player.cash + stockValue() + propertyEquity() + corpsValue() - (S.debt.student.bal + S.debt.card.bal + S.loans.reduce((a,l)=>a+l.bal,0));
  // nota: la hipoteca ya está neteada en propertyEquity
}

  const up=hist[hist.length-1]>=hist[0];
  return `<svg width="${w}" height="${h}" class="inline-block"><polyline points="${pts}" fill="none" stroke="${up?'#22c55e':'#ef4444'}" stroke-width="1.5"/></svg>`;
}

function flash(){ /* re-render inmediato tras acción */ renderLeft(); renderCenter(); }

// EMPLEO
function acceptJob(t){ if(S.player.unlocked.includes(t)){ S.player.jobTier=t; S.player.working=true; log(`✅ Aceptaste el empleo de <b>${JOBS[t].name}</b> (${money(JOBS[t].wage)}/h).`,'pos'); flash(); } }
function study(t){ if(S.player.study) return; const need=JOBS[t].studyNeed; S.player.study={tier:t,need,done:0}; S.player.working=false; log(`🎓 Comienzas a estudiar para <b>${JOBS[t].name}</b> (${need} días, sin ingresos).`,'info'); flash(); }
function setWork(v){ if(S.player.jobTier>0){ S.player.working=v; } else if(v){ log('No tienes empleo activo. Acepta uno primero.','warn'); } flash(); }
function therapy(){ charge(150,'Terapia'); S.player.mental=clamp(S.player.mental+35,0,100); log('🧠 Sesión de terapia: +35% salud mental.','pos'); flash(); }
function vacation(){ charge(600,'Vacaciones'); S.player.resting=true; S.player.restDays=5; S.player.working=false; log('🌴 Te tomas 5 días de vacaciones para recuperar la salud mental.','pos'); flash(); }
function setHousing(i){ if(S.player.livingInProperty>=0) return; S.player.housing=i; log(`🏠 Te mudas a: ${HOUSING[i].name} (${money(HOUSING[i].rent)}/mes).`,'info'); flash(); }

// BIENES RAÍCES
let propSeq=0;
function buyProperty(i, mortgage){
  const r=REALTY[i];
  const id='prop'+(propSeq++);
  if(mortgage){
    const dp=r.price*0.2;
    if(S.player.cash<dp){ log(`No tienes el pie de ${money(dp)} para la hipoteca de ${r.name}.`,'warn'); return; }
    if(S.player.creditScore<540){ log('Tu score crediticio es muy bajo: el banco rechaza la hipoteca.','neg'); return; }
    S.player.cash-=dp;
    const rate=S.macro.baseRate+0.02;
    const principal=r.price-dp, n=360;
    const mr=rate/12;
    const monthly = principal*mr/(1-Math.pow(1+mr,-n));
    S.mortgages.push({propId:id,bal:principal,rate,monthly,termLeft:n});
    log(`🏦 Hipoteca aprobada para <b>${r.name}</b>: pie ${money(dp)}, cuota ${money(monthly)}/mes a ${(rate*100).toFixed(2)}%.`,'pos');
  } else {
    if(S.player.cash<r.price){ log(`Liquidez insuficiente para comprar ${r.name} al contado.`,'warn'); return; }
    S.player.cash-=r.price;
    log(`🏠 Compraste <b>${r.name}</b> al contado por ${money(r.price)}.`,'pos');
  }
  S.properties.push({id,name:r.name,price:r.price,rent:r.rent,livable:!!r.livable,mode:'alquilar',vacant:0,collected:0});
  flash();
}
function setPropMode(id,mode){ const p=S.properties.find(x=>x.id===id); if(!p)return; if(S.player.livingInProperty===id){ S.player.livingInProperty=-1; } p.mode=mode; log(`🔑 ${p.name}: ahora en modo ${mode==='alquilar'?'ALQUILER':mode}.`,'info'); flash(); }
function liveIn(id){ const p=S.properties.find(x=>x.id===id); if(!p||!p.livable)return; S.player.livingInProperty=id; p.mode='habitar'; log(`🏡 Te mudas a tu propiedad <b>${p.name}</b>. Dejas de pagar alquiler.`,'pos'); flash(); }
function sellProperty(id){
  const idx=S.properties.findIndex(x=>x.id===id); if(idx<0)return;
  const p=S.properties[idx];
  const mg=S.mortgages.find(m=>m.propId===id);
  const sale=p.price*rnd(0.96,1.08);
  let net=sale;
  if(mg){ net-=mg.bal; S.mortgages=S.mortgages.filter(m=>m.propId!==id); }
  S.player.cash+=Math.max(0,net);
  if(S.player.livingInProperty===id) S.player.livingInProperty=-1;
  S.properties.splice(idx,1);
  log(`💰 Vendiste <b>${p.name}</b> por ${money(sale)} (neto tras hipoteca: ${money(net)}).`,'pos');
  flash();
}

// BOLSA
function getQty(sym){ const el=$('qty_'+sym); let q=el?parseFloat(el.value):0; return (isNaN(q)||q<=0)?0:q; }
function buyStock(sym, margin){
  const q=getQty(sym); if(!q){ log('Cantidad inválida.','warn'); return; }
  const st=S.stocks[sym], h=S.holdings[sym];
  const cost=q*st.price;
  if(margin){
    // x2: el banco presta igual al aporte; compras 2× con tu cash como margen
    const myCash=cost;            // tu aporte cubre q unidades
    if(S.player.cash<myCash){ log(`Liquidez insuficiente para el margen (${money(myCash)}).`,'warn'); return; }
    S.player.cash-=myCash;
    const newShares=q; const loan=cost;   // banco presta otro tanto -> total 2q? Mantenemos: aporte q + préstamo q
    // posición apalancada total = 2q unidades, deuda = cost
    const totMShares=h.mShares+q*2;
    h.mEntry = h.mShares>0 ? (h.mEntry*h.mShares + st.price*q*2)/totMShares : st.price;
    h.mShares=totMShares; h.mLoan+=cost;
    log(`📊 Compra <b>apalancada x2</b> de ${(q*2).toFixed(2)} ${sym} @ ${money2(st.price)}. Aporte ${money(myCash)}, préstamo ${money(cost)}. Margin call si baja a ${money2(h.mEntry*0.75)}.`,'warn');
  } else {
    if(S.player.cash<cost){ log(`Liquidez insuficiente (${money(cost)}).`,'warn'); return; }
    S.player.cash-=cost;
    const tot=h.shares+q;
    h.avgCost=h.shares>0?(h.avgCost*h.shares+cost)/tot:st.price;
    h.shares=tot;
    log(`🟢 Compraste ${q.toFixed(2)} ${sym} por ${money(cost)} @ ${money2(st.price)}.`,'pos');
  }
  flash();
}
function sellStock(sym){
  const st=S.stocks[sym], h=S.holdings[sym];
  let proceeds=0, msg=[];
  if(h.shares>0){ proceeds+=h.shares*st.price; msg.push(`${h.shares.toFixed(2)} ud al contado`); h.shares=0; h.avgCost=0; }
  if(h.mShares>0){ const gross=h.mShares*st.price; const net=gross-h.mLoan; proceeds+=Math.max(0,net); msg.push(`${h.mShares.toFixed(2)} ud apalancadas (neto tras deuda ${money(net)})`); h.mShares=0; h.mLoan=0; h.mEntry=0; }
  if(proceeds<=0 && msg.length===0){ return; }
  S.player.cash+=proceeds;
  log(`🔴 Vendiste ${sym}: ${msg.join(' + ')}. Recibes ${money(proceeds)}.`,'info');
  flash();
}

// CORPORACIONES
let corpSeq=0;
function foundCorp(type){
  const T=CORP_TYPES.find(t=>t.id===type);
  if(type==='vc' && netWorth()<1e6){ log('Necesitas más de $1M de patrimonio neto para fundar un Fondo de Capital Riesgo.','warn'); return; }
  if(S.player.cash<T.cap){ log(`Capital insuficiente: fundar ${T.name} requiere ${money(T.cap)}.`,'warn'); return; }
  S.player.cash-=T.cap;
  const names={kiosco:'Kiosco',mkt:'Agencia',saas:'SaaS',vc:'Fondo VC'};
  const c={
    id:'corp'+(corpSeq++), type, name:`${names[type]} #${corpSeq}`,
    cash:T.cap*0.3, capital:T.cap, price:T.basePrice, quality:T.baseQ,
    operarios:0, vendedores:0, ceo:false, rdSpend:0, devProgress:type==='saas'?0:100,
    profitHist:[], demandMod:1, demandModDays:0, revToday:0, profitToday:0, lifetimeProfit:0, ipo:false, closed:false,
  };
  S.corps.push(c);
  log(`🏢 Fundaste <b>${c.name}</b> (${T.name}) con ${money(T.cap)} de capital inicial.`,'pos');
  flash();
}
function corpPrice(idx,dir){ const c=S.corps[idx]; const step=c.type==='kiosco'?0.5:c.type==='saas'?2:50; c.price=Math.max(c.type==='kiosco'?0.5:1,c.price+dir*step); flash(); }
function hire(idx,role,d){ const c=S.corps[idx]; c[role]=Math.max(0,c[role]+d); flash(); }
function hireCEO(idx){ const c=S.corps[idx]; c.ceo=!c.ceo; log(c.ceo?`👔 Contrataste un CEO para ${c.name} ($300/día). Opera sin gastar tu energía.`:`Despediste al CEO de ${c.name}. Ahora la operas tú.`, c.ceo?'pos':'info'); flash(); }
function investRD(idx){ const c=S.corps[idx]; if(S.player.cash<2000){ log('Necesitas $2,000 para invertir en I+D.','warn'); return; } S.player.cash-=2000; c.quality=Math.min(100,c.quality+8); log(`🔬 Inversión I+D en ${c.name}: calidad +8 (ahora ${Math.round(c.quality)}).`,'pos'); flash(); }
function rdToggle(idx){ const c=S.corps[idx]; c.rdSpend=c.rdSpend>0?0:200; log(`🔬 I+D continua ${c.rdSpend>0?'activada ($200/día)':'desactivada'} en ${c.name}.`,'info'); flash(); }
function withdrawCorp(idx){ const c=S.corps[idx]; if(c.cash<=0){ log('La empresa no tiene caja para retirar.','warn'); return; } const amt=c.cash; S.player.cash+=amt; c.cash=0; log(`💵 Retiraste ${money(amt)} de la caja de ${c.name} a tu liquidez personal.`,'pos'); flash(); }
function sellCorp(idx){ const c=S.corps[idx]; const price=Math.max(0,corpEBITDA(c)*8)+Math.max(0,c.cash); S.player.cash+=price; log(`🤝 Vendiste <b>${c.name}</b> al mercado por ${money(price)} (EBITDA×8 + caja).`,'pos'); S.corps.splice(idx,1); flash(); }
function ipoCorp(idx){ const c=S.corps[idx]; if(c.ipo){ return; } const val=corpValuation(c); const cashOut=val*0.4; S.player.cash+=cashOut; c.ipo=true; c.publicShare=0.4; log(`📊 <b>IPO</b> de ${c.name}: colocas el 40% en bolsa y recibes ${money(cashOut)} de efectivo líquido instantáneo.`,'pos'); flash(); }

// BANCO
function loanRate(){ const s=S.player.creditScore; const spread = clamp((780-s)/100,0.01,5); return clamp(S.macro.baseRate + 0.03 + spread*0.03, 0.04, 0.32); }
function takeLoan(){
  const maxLoan=Math.max(0,netWorth()*0.5);
  let amt=parseFloat($('loanAmt').value)||0;
  if(amt<100){ log('Monto mínimo $100.','warn'); return; }
  if(amt>maxLoan){ log(`El banco sólo aprueba hasta ${money(maxLoan)} (Patrimonio Neto × 0.5).`,'warn'); amt=maxLoan; }
  if(S.player.creditScore<480){ log('Score crediticio insuficiente: préstamo rechazado.','neg'); return; }
  const rate=loanRate();
  S.loans.push({bal:amt,rate});
  S.player.cash+=amt;
  log(`🏦 Préstamo comercial aprobado: ${money(amt)} a ${(rate*100).toFixed(2)}% TNA.`,'pos');
  flash();
}
function repayLoan(i){ const l=S.loans[i]; if(!l)return; const pay=Math.min(l.bal,S.player.cash); if(pay<=0){ log('Sin liquidez para pagar.','warn'); return; } S.player.cash-=pay; l.bal-=pay; if(l.bal<=1){ S.loans.splice(i,1); log('✅ Préstamo comercial cancelado por completo.','pos'); } else log(`Pagaste ${money(pay)} del préstamo. Saldo: ${money(l.bal)}.`,'info'); flash(); }
function payCard(amt){ const cc=S.debt.card; const pay=amt<0?cc.bal:Math.min(amt,cc.bal); const real=Math.min(pay,S.player.cash); if(real<=0){ log('Sin liquidez para pagar la tarjeta.','warn'); return; } S.player.cash-=real; cc.bal-=real; S.player.creditScore=clamp(S.player.creditScore+0.3,300,850); log(`💳 Pago a tarjeta: ${money(real)}. Saldo: ${money(cc.bal)}.`,'pos'); flash(); }
function payStudent(amt){ const sl=S.debt.student; const pay=amt<0?sl.bal:Math.min(amt,sl.bal); const real=Math.min(pay,S.player.cash); if(real<=0){ log('Sin liquidez para pagar.','warn'); return; } S.player.cash-=real; sl.bal-=real; S.player.creditScore=clamp(S.player.creditScore+0.4,300,850); log(`🎓 Pago a préstamo universitario: ${money(real)}. Saldo: ${money(sl.bal)}.`,'pos'); if(sl.bal<=0) log('🎉 ¡Préstamo universitario saldado por completo!','pos'); flash(); }

/* ============================== VELOCIDAD ================================ */
const SPEEDS = { 0:0, 1:1000, 2:500, 5:200, 10:100 };
function setSpeed(s){
  S.speed=s;
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  if(s>0) S.timer=setInterval(tick, SPEEDS[s]);
  document.querySelectorAll('.spd').forEach(b=>{ b.classList.toggle('active',+b.dataset.spd===s); if(+b.dataset.spd===s){ b.classList.add('bg-blue-700','text-white'); } else b.classList.remove('bg-blue-700','text-white'); });
}

/* ============================== INIT ===================================== */
function init(){
  initStocks();
  // listeners de pestañas
  document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',()=>{
    S.tab=b.dataset.tab;
    document.querySelectorAll('.tabbtn').forEach(x=>x.classList.toggle('active',x===b));
    renderCenter();
  }));
  document.querySelectorAll('.spd').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.spd)));

  log('🟢 <b>CAPITAL HOLDINGS</b> iniciado. Empiezas con $500, score 600, empleo de Operario ($12/h) y una deuda universitaria de $12,000 al 6.5%.','info');
  log('🎯 Objetivo: amasar patrimonio neto hasta convertirte en un holding multimillonario. Pulsa una velocidad para comenzar el tiempo.','info');
  log('💡 Consejo: paga los intereses a tiempo para subir tu score, estudia para escalar de empleo e invierte el excedente.','info');

  S.player.working=true; // por defecto trabajando como operario
  render();
  setSpeed(0);
}
window.addEventListener('DOMContentLoaded', init);

/* exponer funciones usadas por onclick inline */
Object.assign(window,{acceptJob,study,setWork,therapy,vacation,setHousing,buyProperty,setPropMode,liveIn,sellProperty,buyStock,sellStock,foundCorp,corpPrice,hire,hireCEO,investRD,rdToggle,withdrawCorp,sellCorp,ipoCorp,takeLoan,repayLoan,payCard,payStudent});
</script>
